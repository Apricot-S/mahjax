name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest typing_extensions>=4.2.0

      - name: Run test suite (excluding the UI)
        env:
          PYTHONPATH: .
        run: |
          pytest --ignore=tests/ui -vv

  ui:
    # Its own job, so the UI's full games run beside the main suite rather than after it.
    name: Run UI Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest

      - name: Run the UI tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ui -vv
