name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python. They install different
        # JAX releases (3.11 gets no newer than 0.10.2), so both are tested.
        python-version: ["3.11", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest typing_extensions>=4.2.0

      - name: Run test suite (excluding the UI)
        env:
          PYTHONPATH: .
        run: |
          pytest --ignore=tests/ui -vv

  ui:
    # Its own job, so the UI's full games run beside the main suite rather than after it.
    name: Run UI Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest

      - name: Run the UI tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ui -vv

  lint:
    # Lint only, with the Ruff pinned in pyproject's lint group; the code is not held to `ruff format`.
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          pip install -U pip
          pip install --group lint

      - name: Run Ruff
        run: |
          ruff check --output-format=github .

  types:
    # What mypy reports follows JAX's type stubs, which change between releases,
    # so JAX is pinned here as well as mypy. It pins only this check: mahjax
    # itself runs on any JAX its Python allows.
    name: Run mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy and the dependencies
        run: |
          pip install -U pip
          pip install -e . --group typing "jax==0.12.0.1"

      - name: Run mypy
        run: |
          mypy mahjax
